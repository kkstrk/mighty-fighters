version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      commit-message:
          prefix: chore
          include: scope
      groups:
          actions:
              patterns: ["*"]
              update-types: [minor, patch]
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # Longer than minimumReleaseAge in pnpm-workspace.yaml, so PRs never hit it.
      cooldown:
          default-days: 7
      commit-message:
          prefix: chore
          include: scope
      # Majors stay ungrouped so each breaking bump gets its own PR and review.
      groups:
          dev:
              dependency-type: development
              update-types: [minor, patch]
          prod:
              dependency-type: production
              update-types: [minor, patch]
